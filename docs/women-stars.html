   const shown=visibleStars(),time=now/1000;shown.forEach(s=>{const baseY=s.y;s.y=baseY+Math.sin(time*s.speed+s.phase)*s.float;const isGold=s.deep&&s.p.visibility==='广为人知',c=colors[s.p.field]||'#b56de1',r=s.r*(hover===s?1.22:(query?1.12:1));ctx.save();ctx.globalAlpha=s.deep?1:.7;drawCrystal(s,r,c,isGold);ctx.restore();if(hover===s){crystalPath(s.x,s.y,r+4,(hash(s.p.seed||1)-.5)*.08);ctx.strokeStyle='rgba(92,38,124,.7)';ctx.lineWidth=1;ctx.stroke()}s.y=baseY});if(animationActive)scheduleDraw()}

 const fields=['全部',...new Set(data.map(d=>d.field))],nav=document.querySelector('#filters');fields.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{active=f;[...nav.children].forEach(x=>x.setAttribute('aria-pressed',x===b));hover=null;scheduleDraw()};nav.append(b)});
 const searchRoot=document.querySelector('#person-search'),searchInput=document.querySelector('#person-search-input'),searchResults=document.querySelector('#search-results'),searchClear=document.querySelector('#search-clear'),status=document.querySelector('#archive-status');
 function searchCandidates(){const needle=query.trim().normalize('NFKD').toLocaleLowerCase();if(!needle)return[];return data.filter(p=>searchText(p).includes(needle)).slice(0,8)}
 function updateSearch(){const found=searchCandidates();searchRoot.classList.toggle('has-value',Boolean(query));searchRoot.classList.toggle('open',Boolean(query));searchInput.setAttribute('aria-expanded',Boolean(query));searchResults.innerHTML=query?(found.length?found.map((p,i)=>`<button class="search-result" type="button" role="option" data-id="${safe(p.id)}"><b>${safe(p.name)}</b><small>${safe(nameAliases[p.name]?`${nameAliases[p.name]} · `:'')}${safe(p.field)} · ${safe(p.region)}</small></button>`).join(''):`<div class="search-empty">没有找到这个名字，试试英文原名、中文译名或姓名的一部分</div>`):'';const count=visibleStars().length;status.textContent=query?`找到 ${count} 位匹配人物 · 点击结果或晶体进入人物卡`:`${data.length} 位资料与照片已核验 · ${archive.length-data.length} 位仍在补证，不展示空卡`;hover=null;scheduleDraw()}
 searchInput.addEventListener('input',()=>{query=searchInput.value;updateSearch()});searchInput.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=searchCandidates()[0];if(first){e.preventDefault();openPerson(first)}}else if(e.key==='Escape'){query='';searchInput.value='';updateSearch();searchInput.blur()}});searchClear.addEventListener('click',()=>{query='';searchInput.value='';updateSearch();searchInput.focus()});searchResults.addEventListener('click',e=>{const button=e.target.closest('[data-id]'),p=button&&data.find(x=>x.id===button.dataset.id);if(p)openPerson(p)});document.addEventListener('pointerdown',e=>{if(!searchRoot.contains(e.target))searchRoot.classList.remove('open')});searchInput.addEventListener('focus',()=>{if(query)searchRoot.classList.add('open')});
 function nearest(e){let hit=null,dist=24;for(const s of visibleStars()){const d=Math.hypot(e.clientX-s.x,e.clientY-s.y),reach=Math.max(10,s.r*1.65);if(d<Math.min(dist,reach)){dist=d;hit=s}}return hit}
 canvas.addEventListener('pointermove',e=>{const next=nearest(e);if(next!==hover){hover=next;scheduleDraw()}if(hover){tip.querySelector('b').textContent=hover.p.name;tip.querySelector('span').textContent=`${hover.p.field} · ${turnLabel(hover.p)}关键阶段`;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.classList.add('show');canvas.style.cursor='pointer'}else{tip.classList.remove('show');canvas.style.cursor='crosshair'}});
 canvas.addEventListener('pointerleave',()=>{if(hover){hover=null;scheduleDraw()}tip.classList.remove('show')});
 canvas.addEventListener('click',e=>{const s=nearest(e);if(s)openPerson(s.p)});
 function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
 function turnLabel(p){return typeof p.turnAge==='number'?`${p.turnAge}岁`:safe(p.turnAge||'关键阶段')}
 function openPerson(p,{updateUrl=true}={}){if(!p?.publicReady)return;animationActive=false;document.querySelector('#hint').classList.add('hidden');const deep=p.editorialStatus?.startsWith('深度');if(updateUrl){const url=new URL(location.href);url.searchParams.set('person',p.id);history.pushState({person:p.id},'',url)}portrait.innerHTML=`<img src="${safe(p.photo)}" alt="" aria-label="${safe(p.name)}的公开照片" referrerpolicy="no-referrer"><div class="portrait-fallback" hidden aria-label="照片暂时无法加载">${safe(p.name.slice(0,1))}</div><p class="portrait-caption">${safe(p.photoAuthor)} · ${safe(p.photoLicense)} · <a href="${safe(p.photoPage)}" target="_blank" rel="noreferrer">原图与许可</a></p>`;const portraitImage=portrait.querySelector('img'),portraitFallback=portrait.querySelector('.portrait-fallback');const showPortraitFallback=()=>{portraitImage.hidden=true;portraitFallback.hidden=false};portraitImage.addEventListener('error',showPortraitFallback,{once:true});if(portraitImage.complete&&!portraitImage.naturalWidth)showPortraitFallback();
  const stages=[['处境',p.situation],['资源',p.resources],['行动',p.action],['结果',p.outcome],['代价',p.cost]];
  const sats=[...p.strengths,...p.constraintTags].slice(0,6);const pos=[[12,42],[58,30],[64,68],[10,72],[36,22],[38,80]];
  story.innerHTML=`<div class="kicker">${safe(p.region)} · ${safe(p.field)} · ${turnLabel(p)}发生关键转折</div><h2>${safe(p.name)}</h2><p class="identity">${safe(p.identity)}</p><div class="tags">${p.strengths.map(x=>`<span class="tag">${safe(x)}</span>`).join('')}</div><div class="life-viz">${stages.map((x,i)=>`<section class="stage"><small>0${i+1}</small><h3>${x[0]}</h3><p>${safe(x[1])}</p></section>`).join('')}</div><div class="balance"><div class="orbit"><h3>她当时拥有 / 承受什么</h3><div class="orbit-core">关键转折<br>${turnLabel(p)}</div>${sats.map((x,i)=>`<span class="satellite" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${safe(x)}</span>`).join('')}</div><div><div class="boundary"><h3>不要照搬</h3><p>${safe(p.boundary)}</p></div><div class="action"><small>把她的方法缩小为你的7天实验</small><p>${safe(p.firstStep)}</p></div></div></div><div class="sources">证据边界：${safe(p.evidence)}<br>适用条件：${safe(p.conditions)}<br>资料来源：${p.sources.map((u,i)=>`<a href="${safe(u)}" target="_blank" rel="noreferrer">来源 ${i+1}</a>`).join(' · ')}</div>`;
  detail.classList.add('open');detail.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.querySelector('#close').focus()}
 function close({updateUrl=true}={}){detail.classList.remove('open');detail.setAttribute('aria-hidden','true');document.body.style.overflow='hidden';animationActive=!document.hidden;scheduleDraw();if(updateUrl){const url=new URL(location.href);url.searchParams.delete('person');history.pushState({},'',url)}}document.querySelector('#close').onclick=()=>close();addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 document.addEventListener('visibilitychange',()=>{animationActive=!document.hidden&&!detail.classList.contains('open');if(animationActive)scheduleDraw()});
 addEventListener('popstate',()=>{const id=new URLSearchParams(location.search).get('person'),p=data.find(x=>x.id===id);if(p)openPerson(p,{updateUrl:false});else close({updateUrl:false})});
 addEventListener('resize',resize,{passive:true});resize();const initialId=new URLSearchParams(location.search).get('person'),initialPerson=data.find(x=>x.id===initialId);if(initialPerson)openPerson(initialPerson,{updateUrl:false});
})();
