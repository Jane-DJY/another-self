<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' file:; style-src 'unsafe-inline'; img-src 'self' file: data:; font-src 'self' file:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>群星闪耀｜女性人生参照库</title>
<style>
  :root{--night:#3379ef;--deep:#155ee0;--ink:#fffef7;--muted:rgba(255,255,255,.78);--gold:#ffd21c;--line:rgba(255,255,255,.38);--panel:rgba(12,55,150,.9)}
  *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--night);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
  body{overflow:hidden}.sky{position:fixed;inset:0;background:linear-gradient(145deg,#2d70e9 0%,#3d83f8 48%,#2f73ef 100%)}
  #stars{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
  .topbar{position:fixed;z-index:4;left:clamp(18px,4vw,58px);right:clamp(18px,4vw,58px);top:24px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
  .brand{pointer-events:auto}.brand a{color:var(--muted);text-decoration:none;font-size:12px}.brand h1{margin:9px 0 4px;font:500 clamp(28px,4vw,54px)/1 ui-serif,Georgia,"Songti SC",serif;letter-spacing:.08em}.brand p{margin:0;color:var(--muted);font-size:12px;letter-spacing:.08em}
  .counter{pointer-events:auto;text-align:right;color:var(--muted);font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace}.counter strong{display:block;color:var(--ink);font-size:20px;font-weight:400}
  .filters{position:fixed;z-index:4;left:50%;bottom:24px;transform:translateX(-50%);display:flex;max-width:calc(100vw - 28px);gap:7px;padding:7px;border:1px solid var(--line);border-radius:999px;background:rgba(33,100,218,.7);backdrop-filter:blur(16px);overflow-x:auto;scrollbar-width:none}
  .filters button{flex:none;border:0;border-radius:999px;padding:8px 12px;background:transparent;color:rgba(255,255,255,.82);font:500 11px/1 sans-serif;cursor:pointer}.filters button[aria-pressed="true"]{background:#fff;color:#2466d8}
  .hint{position:fixed;z-index:3;left:50%;bottom:82px;transform:translateX(-50%);color:rgba(229,235,251,.56);font-size:11px;letter-spacing:.12em;pointer-events:none;transition:opacity .4s}.hint.hidden{opacity:0}
  .tooltip{position:fixed;z-index:5;min-width:130px;padding:9px 11px;border:1px solid rgba(255,255,255,.58);background:rgba(35,101,218,.9);backdrop-filter:blur(10px);pointer-events:none;opacity:0;transform:translate(12px,12px);transition:opacity .12s}.tooltip.show{opacity:1}.tooltip b{display:block;font:500 15px/1.3 ui-serif,Georgia,"Songti SC",serif}.tooltip span{color:rgba(255,255,255,.78);font-size:10px}
  .detail{position:fixed;z-index:10;inset:0;display:grid;grid-template-columns:minmax(280px,38vw) 1fr;background:#081025;transform:translateY(105%);transition:transform .65s cubic-bezier(.22,1,.36,1);overflow:auto}.detail.open{transform:none}
  .portrait{position:relative;min-height:100svh;background:radial-gradient(circle at 50% 30%,#23375d,#0c1630 68%);overflow:hidden}.portrait img{width:100%;height:100svh;object-fit:cover;filter:saturate(.78) contrast(1.04);opacity:.8}.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#081025 100%)}
  .portrait-fallback{display:grid;height:100%;min-height:100svh;place-items:center;color:rgba(247,241,223,.26);font:500 110px/1 ui-serif,serif}
  .portrait-caption{position:absolute;z-index:2;left:28px;right:28px;bottom:28px;color:var(--muted);font-size:9px;line-height:1.5}.portrait-caption a{color:inherit}
  .story{min-width:0;padding:clamp(72px,8vw,116px) clamp(26px,7vw,104px) 80px;position:relative}.close{position:absolute;right:26px;top:24px;border:1px solid var(--line);border-radius:50%;width:38px;height:38px;background:transparent;color:var(--ink);font-size:20px;cursor:pointer}
  .kicker{color:var(--gold);font:11px/1.2 ui-monospace,monospace;letter-spacing:.14em}.story h2{margin:12px 0 7px;font:500 clamp(40px,7vw,88px)/.95 ui-serif,Georgia,"Songti SC",serif;letter-spacing:-.04em}.identity{margin:0;color:var(--muted);font-size:13px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:22px 0 34px}.tag{border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:#ccd5ec;font-size:10px}
  .life-viz{position:relative;display:grid;grid-template-columns:repeat(5,minmax(92px,1fr));gap:0;margin:18px 0 38px;padding-top:38px}.life-viz::before{content:"";position:absolute;top:15px;left:8%;right:8%;height:1px;background:linear-gradient(90deg,#7b88a6,#f0c66c,#c9d5f2)}.stage{position:relative;padding:0 14px 0 0}.stage::before{content:"";position:absolute;top:-28px;left:0;width:9px;height:9px;border-radius:50%;background:var(--night);border:2px solid var(--gold);box-shadow:0 0 16px rgba(240,198,108,.65)}.stage small{display:block;color:var(--gold);font:10px/1.3 ui-monospace,monospace;letter-spacing:.08em}.stage h3{margin:7px 0 5px;font-size:13px;font-weight:500}.stage p{margin:0;color:var(--muted);font-size:11px;line-height:1.55}
  .balance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.orbit{min-height:180px;border:1px solid var(--line);background:rgba(255,255,255,.018);position:relative;overflow:hidden}.orbit h3{position:absolute;left:16px;top:13px;margin:0;color:var(--muted);font-size:11px;font-weight:400;letter-spacing:.1em}.orbit-core{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:1px solid var(--gold);color:var(--ink);font:500 12px/1.3 ui-serif,serif;text-align:center;box-shadow:0 0 34px rgba(240,198,108,.12)}.satellite{position:absolute;max-width:42%;color:#c5cee3;font-size:10px;line-height:1.35}.satellite::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:5px;box-shadow:0 0 8px var(--gold)}
  .boundary{padding:18px;border-left:2px solid #d06b72;background:rgba(208,107,114,.06)}.boundary h3{margin:0 0 8px;color:#eea0a4;font-size:12px}.boundary p{margin:0;color:#c4ccde;font-size:12px;line-height:1.7}
  .action{margin-top:18px;padding:20px;border:1px solid rgba(240,198,108,.4);background:linear-gradient(120deg,rgba(240,198,108,.08),transparent)}.action small{color:var(--gold);letter-spacing:.12em}.action p{margin:8px 0 0;font:500 18px/1.45 ui-serif,serif}
  .sources{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:10px}.sources a{color:var(--muted);overflow-wrap:anywhere}.watermark{position:fixed;right:18px;bottom:12px;z-index:2;color:rgba(255,255,255,.42);font-size:9px;pointer-events:none}
  @media(max-width:760px){body{overflow:auto}.topbar{top:16px}.brand h1{font-size:28px}.brand p{max-width:220px}.detail{grid-template-columns:1fr}.portrait{min-height:48svh}.portrait img,.portrait-fallback{height:48svh;min-height:48svh}.story{padding-top:64px}.life-viz{grid-template-columns:1fr;padding:0 0 0 25px;gap:18px}.life-viz::before{top:0;bottom:0;left:5px;right:auto;width:1px;height:auto}.stage::before{top:4px;left:-24px}.balance{grid-template-columns:1fr}.filters{bottom:12px}.hint{bottom:66px}}
  @media(prefers-reduced-motion:reduce){.detail{transition:none}}
</style>
</head>
<body>
<main class="sky" aria-label="五十位女性人生参照组成的星空">
  <canvas id="stars"></canvas>
  <header class="topbar"><div class="brand"><a href="diary-river-modernist-organic-ribbons-web.html">← 回到我的河流</a><h1>群星闪耀</h1><p>她们不是答案，是五十种已经发生过的可能</p></div><div class="counter"><strong id="visible-count">50</strong>WOMEN · <span id="field-count">0</span> FIELDS</div></header>
  <div class="hint" id="hint">移动鼠标辨认一颗星 · 点击进入她的人生轨道</div>
  <nav class="filters" aria-label="按领域筛选" id="filters"></nav>
  <div class="tooltip" id="tooltip"><b></b><span></span></div>
</main>
<article class="detail" id="detail" aria-hidden="true"><section class="portrait" id="portrait"></section><section class="story"><button class="close" id="close" aria-label="关闭">×</button><div id="story"></div></section></article>
<div class="watermark">爱可视化的简女士 · Jane of Visual Stories</div>
<script src="women-stars-data.js"></script>
<script>
(()=>{
 const data=window.WOMEN_STARS||[],canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d'),tip=document.querySelector('#tooltip'),detail=document.querySelector('#detail'),story=document.querySelector('#story'),portrait=document.querySelector('#portrait');
 const colors={'科学技术':'#ffffff','商业产品':'#dce8ff','艺术创作':'#ffffff','教育':'#cfe1ff','医疗照护':'#ffffff','公共事务':'#d8e7ff','体育探险':'#ffffff','农业与技能劳动':'#c9dcff','社区行动':'#ffffff','家庭生活与中年重启':'#d8e7ff'};
 let stars=[],active='全部',hover=null,w=0,h=0,dpr=1,t=0,exclusionRects=[];
 function hash(n){let x=Math.sin(n*9301+49297)*233280;return x-Math.floor(x)}
 function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);layout()}
 function reservedRects(){
   const pad=22,brand=document.querySelector('.brand').getBoundingClientRect(),filters=document.querySelector('.filters').getBoundingClientRect();
   return [
     {left:Math.max(0,brand.left-pad),top:Math.max(0,brand.top-pad),right:Math.min(w,brand.right+pad),bottom:Math.min(h,brand.bottom+pad)},
     {left:Math.max(0,filters.left-pad),top:Math.max(0,filters.top-pad),right:Math.min(w,filters.right+pad),bottom:Math.min(h,filters.bottom+pad)}
   ];
 }
 function isReserved(x,y,pad=0){return exclusionRects.some(r=>x>=r.left-pad&&x<=r.right+pad&&y>=r.top-pad&&y<=r.bottom+pad)}
 function layout(){exclusionRects=reservedRects();stars=data.map((p,i)=>{const margin=55,top=70,bottom=55;let x=0,y=0;for(let attempt=0;attempt<50;attempt++){x=margin+hash(i+3+attempt*101)*(w-margin*2);y=top+hash(i+71+attempt*137)*Math.max(160,h-top-bottom);if(!isReserved(x,y,24))break}return{p,x,y,r:3.1+Math.min(5,p.turnAge/15),phase:hash(i+151)*6.28,speed:.45+hash(i+222)*.75}})}
 function starPath(x,y,r,rotation=-Math.PI/2){ctx.beginPath();for(let i=0;i<10;i++){const rr=i%2===0?r:r*.43;const a=rotation+i*Math.PI/5;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath()}
 function draw(){t+=.012;ctx.clearRect(0,0,w,h);for(let i=0;i<145;i++){const x=hash(i+800)*w,y=hash(i+950)*h,r=1.8+hash(i+1220)*4.8,a=.42+hash(i+999)*.34;if(isReserved(x,y,r+7))continue;starPath(x,y,r,hash(i+1300)*.45-Math.PI/2);ctx.fillStyle=`rgba(229,239,255,${a})`;ctx.fill()}
   const shown=stars.filter(s=>active==='全部'||s.p.field===active);shown.forEach((s,i)=>{const pulse=.9+.1*Math.sin(t*s.speed+s.phase),isGold=s.p.visibility==='广为人知',c=isGold?'#ffd21c':(colors[s.p.field]||'#ffffff'),r=s.r*1.8*(hover===s?1.24:1)*pulse;ctx.save();ctx.shadowColor=isGold?'rgba(255,215,35,.52)':'rgba(255,255,255,.4)';ctx.shadowBlur=hover===s?14:5;starPath(s.x,s.y,r,s.phase*.12-Math.PI/2);ctx.fillStyle=c;ctx.fill();ctx.restore();if(hover===s){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1.2;starPath(s.x,s.y,r+6,s.phase*.12-Math.PI/2);ctx.stroke()}});requestAnimationFrame(draw)}
 const fields=['全部',...new Set(data.map(d=>d.field))];document.querySelector('#field-count').textContent=fields.length-1;const nav=document.querySelector('#filters');fields.forEach((f,i)=>{const b=document.createElement('button');b.textContent=f;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{active=f;[...nav.children].forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelector('#visible-count').textContent=data.filter(x=>f==='全部'||x.field===f).length;hover=null};nav.append(b)});
 function nearest(e){let hit=null,dist=24;for(const s of stars){if(active!=='全部'&&s.p.field!==active)continue;const d=Math.hypot(e.clientX-s.x,e.clientY-s.y);if(d<dist){dist=d;hit=s}}return hit}
 canvas.addEventListener('pointermove',e=>{hover=nearest(e);if(hover){tip.querySelector('b').textContent=hover.p.name;tip.querySelector('span').textContent=`${hover.p.field} · ${hover.p.turnAge}岁关键转折`;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.classList.add('show');canvas.style.cursor='pointer'}else{tip.classList.remove('show');canvas.style.cursor='crosshair'}});
 canvas.addEventListener('click',e=>{const s=nearest(e);if(s)openPerson(s.p)});
 function safe(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
 function openPerson(p){document.querySelector('#hint').classList.add('hidden');portrait.innerHTML=p.photo?`<img src="${safe(p.photo)}" alt="${safe(p.name)}的公开照片"><p class="portrait-caption">${safe(p.photoAuthor)} · ${safe(p.photoLicense)} · <a href="${safe(p.photoPage)}" target="_blank" rel="noreferrer">原图与许可</a></p>`:`<div class="portrait-fallback" aria-label="暂无开放许可照片">${safe(p.name.slice(0,1))}</div><p class="portrait-caption">暂未找到明确开放许可照片，因此不使用新闻图片替代。</p>`;
  const stages=[['处境',p.situation],['资源',p.resources],['行动',p.action],['结果',p.outcome],['代价',p.cost]];
  const sats=[...p.strengths,...p.constraintTags].slice(0,6);const pos=[[12,42],[58,30],[64,68],[10,72],[36,22],[38,80]];
  story.innerHTML=`<div class="kicker">${safe(p.region)} · ${safe(p.field)} · ${p.turnAge}岁发生关键转折</div><h2>${safe(p.name)}</h2><p class="identity">${safe(p.identity)}</p><div class="tags">${p.strengths.map(x=>`<span class="tag">${safe(x)}</span>`).join('')}</div><div class="life-viz">${stages.map((x,i)=>`<section class="stage"><small>0${i+1}</small><h3>${x[0]}</h3><p>${safe(x[1])}</p></section>`).join('')}</div><div class="balance"><div class="orbit"><h3>她当时拥有 / 承受什么</h3><div class="orbit-core">关键转折<br>${p.turnAge}岁</div>${sats.map((x,i)=>`<span class="satellite" style="left:${pos[i][0]}%;top:${pos[i][1]}%">${safe(x)}</span>`).join('')}</div><div><div class="boundary"><h3>不要照搬</h3><p>${safe(p.boundary)}</p></div><div class="action"><small>把她的方法缩小为你的7天实验</small><p>${safe(p.firstStep)}</p></div></div></div><div class="sources">适用条件：${safe(p.conditions)}<br>资料来源：${p.sources.map((u,i)=>`<a href="${safe(u)}" target="_blank" rel="noreferrer">来源 ${i+1}</a>`).join(' · ')}</div>`;
  detail.classList.add('open');detail.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';document.querySelector('#close').focus()}
 function close(){detail.classList.remove('open');detail.setAttribute('aria-hidden','true');document.body.style.overflow='hidden'}document.querySelector('#close').onclick=close;addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 addEventListener('resize',resize);resize();draw();
})();
</script>
</body></html>
