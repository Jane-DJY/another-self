  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

}

svg {

          const eased = t * t * (3 - 2 * t);
          const wave = Math.sin((index + 1) * Math.PI / 3 + phase) * 1.1 * (1 - t);
          return Math.max(0, start + (target - start) * eased + wave);
        });

      function el(tag, attrs = {}, text = &#x27;&#x27;) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
        if (text) node.textContent = text;
        return node;
      }

      function smooth(points) {
        let d = `M${points[0][0]},${points[0][1]}`;
        for (let i = 0; i &lt; points.length - 1; i += 1) {
          const p0 = points[i - 1] || points[i];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
        }
        return d;
      }

      function wrapText(text, maxWidth, fontSize) {
        const lines = [];
        let line = &#x27;&#x27;;
        let lineWidth = 0;
        [...text].forEach((character) =&gt; {
          const characterWidth = /[\u2e80-\u9fff]/.test(character)
            ? fontSize
            : character === &#x27; &#x27; ? fontSize * 0.35 : fontSize * 0.58;
          if (line &amp;&amp; lineWidth + characterWidth &gt; maxWidth) {
            lines.push(line.trimEnd());
            line = character.trimStart();
            lineWidth = character.trim() ? characterWidth : 0;
          } else {
            line += character;
            lineWidth += characterWidth;
          }
        });
        if (line.trim()) lines.push(line.trim());
        return lines.length ? lines : [&#x27;&#x27;];
      }

      function addWrappedText(svg, className, textValue, x, centerY, anchor, maxWidth, fontSize) {
        const lines = wrapText(textValue, maxWidth, fontSize);
        const lineHeight = fontSize + 3;
        const startY = centerY - ((lines.length - 1) * lineHeight) / 2;
        const text = el(&#x27;text&#x27;, { class: className, x, y: startY, &#x27;text-anchor&#x27;: anchor });
        lines.forEach((line, index) =&gt; {
          text.appendChild(el(&#x27;tspan&#x27;, { x, dy: index === 0 ? 0 : lineHeight }, line));
        });
        svg.appendChild(text);
        return text;
      }

      function pointAt(points, monthPosition) {
        const lower = Math.floor(monthPosition);
        const upper = Math.min(points.length - 1, Math.ceil(monthPosition));
        if (lower === upper) return points[lower];
        const progress = monthPosition - lower;
        return [
          points[lower][0] + (points[upper][0] - points[lower][0]) * progress,
          points[lower][1] + (points[upper][1] - points[lower][1]) * progress
        ];
      }

      function playAnimation(svg) {
        animationTimers.forEach(clearTimeout);
        animationTimers = [];
        svg.classList.remove(&#x27;dor-idle-motion&#x27;);
        const animated = [...svg.querySelectorAll(&#x27;[data-animate-theme]&#x27;)];
        animated.forEach((node) =&gt; node.classList.remove(&#x27;dor-visible&#x27;));
        const sequence = [&#x27;work&#x27;, &#x27;creation&#x27;, &#x27;learning&#x27;, &#x27;venture&#x27;, &#x27;life&#x27;];
        const reducedMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
        if (reducedMotion) {
          animated.forEach((node) =&gt; node.classList.add(&#x27;dor-visible&#x27;));
          return;
        }
        sequence.forEach((key, index) =&gt; {
          animationTimers.push(setTimeout(() =&gt; {
            animated
              .filter((node) =&gt; node.dataset.animateTheme === key)
              .forEach((node) =&gt; node.classList.add(&#x27;dor-visible&#x27;));
          }, index * 620));
        });
        animationTimers.push(setTimeout(() =&gt; {
          svg.classList.add(&#x27;dor-idle-motion&#x27;);
        }, sequence.length * 620 + 500));
      }

      function revealAllThemes(svg) {
        animationTimers.forEach(clearTimeout);
        animationTimers = [];
        svg.querySelectorAll(&#x27;.dor-animated&#x27;).forEach((node) =&gt; node.classList.add(&#x27;dor-visible&#x27;));

      function animateFutureGrowth(svg, startY, endY, width) {
        if (forecastAnimationFrame) cancelAnimationFrame(forecastAnimationFrame);
        svg.classList.remove(&#x27;dor-idle-motion&#x27;);
        const cover = el(&#x27;rect&#x27;, {
