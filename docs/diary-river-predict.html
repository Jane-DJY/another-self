  mask: var(--checkmark-image) center / 12px 12px no-repeat;

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);

}

.form-range:disabled {

          &lt;p class=&quot;dr-group-title text-small&quot;&gt;文字与分割线&lt;/p&gt;
          &lt;div class=&quot;dr-color-grid&quot;&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;主题字&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#f7f4d5&quot; data-setting=&quot;band-text-color&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;节点字&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#f7f4d5&quot; data-setting=&quot;event-text-color&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;分割线&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#f7f4d5&quot; data-setting=&quot;divider-color&quot;&gt;&lt;/label&gt;
          &lt;/div&gt;

          &lt;p class=&quot;dr-group-title text-small&quot;&gt;河流颜色&lt;/p&gt;
          &lt;div class=&quot;dr-color-grid&quot; aria-label=&quot;主题颜色&quot;&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;工作&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#105666&quot; data-setting=&quot;work-color&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;个人创作&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#d3968c&quot; data-setting=&quot;creation-color&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;副业尝试&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#f7f4d5&quot; data-setting=&quot;venture-color&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;学习&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#839958&quot; data-setting=&quot;learning-color&quot;&gt;&lt;/label&gt;
            &lt;label class=&quot;dr-color-control form-label&quot;&gt;生活与关系&lt;input class=&quot;form-control form-control-color&quot; type=&quot;color&quot; value=&quot;#0a3323&quot; data-setting=&quot;life-color&quot;&gt;&lt;/label&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/details&gt;

    &lt;/aside&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;diary-river-2026&#x27;);
      const host = root?.querySelector(&#x27;[data-chart]&#x27;);
      if (!root || !host) return;
      const poster = root.querySelector(&#x27;.dr-poster&#x27;);
      const nodePopover = root.querySelector(&#x27;[data-node-popover]&#x27;);
      const nodePopoverTitle = root.querySelector(&#x27;[data-node-popover-title]&#x27;);
      const nodePopoverDetail = root.querySelector(&#x27;[data-node-popover-detail]&#x27;);
      function hideNodePopover() {
        if (nodePopover) nodePopover.hidden = true;
      }
      function showNodePopover(item, trigger) {
        if (!poster || !nodePopover || !nodePopoverTitle || !nodePopoverDetail) return;
        nodePopoverTitle.textContent = item.text;
        nodePopoverDetail.textContent = item.detail;
        nodePopover.hidden = false;
        const posterRect = poster.getBoundingClientRect();
        const triggerRect = trigger.getBoundingClientRect();
        const popoverWidth = Math.min(192, posterRect.width - 22);
        const preferredLeft = triggerRect.left - posterRect.left - popoverWidth / 2;
        const left = Math.max(11, Math.min(preferredLeft, posterRect.width - popoverWidth - 11));
        const top = Math.min(triggerRect.bottom - posterRect.top + 7, posterRect.height - nodePopover.offsetHeight - 11);
        nodePopover.style.left = `${left}px`;
        nodePopover.style.top = `${Math.max(11, top)}px`;
      }
      requestAnimationFrame(() =&gt; {
        const settings = root.querySelector(&#x27;.dr-settings&#x27;);
        if (settings) settings.open = root.getBoundingClientRect().width &gt; 650;
      });

      const historyMonths = [
        { label: &#x27;1月&#x27;, n: 6 }, { label: &#x27;2月&#x27;, n: 6 }, { label: &#x27;3月&#x27;, n: 27 },
        { label: &#x27;4月&#x27;, n: 24 }, { label: &#x27;5月&#x27;, n: 23 }, { label: &#x27;6月&#x27;, n: 25 },
        { label: &#x27;7月&#x27;, n: 29 }
      ];
      const historySeries = [
        { key: &#x27;learning&#x27;, label: &#x27;学习&#x27;, color: &#x27;var(--dr-learning)&#x27;, values: [4.7, 5.3, 13.8, 25.1, 5.5, 14.1, 6.2] },
        { key: &#x27;work&#x27;, label: &#x27;工作&#x27;, color: &#x27;var(--dr-work)&#x27;, values: [76.3, 87.6, 43.1, 42.9, 49.1, 45.7, 37.6] },
        { key: &#x27;venture&#x27;, label: &#x27;副业尝试&#x27;, color: &#x27;var(--dr-venture)&#x27;, values: [1.4, 0.0, 0.4, 0.0, 0.7, 0.0, 2.6] },
        { key: &#x27;creation&#x27;, label: &#x27;个人创作&#x27;, color: &#x27;var(--dr-creation)&#x27;, values: [6.4, 5.6, 10.4, 13.2, 10.2, 21.3, 41.3] },
        { key: &#x27;life&#x27;, label: &#x27;生活与关系&#x27;, color: &#x27;var(--dr-life)&#x27;, values: [11.3, 1.6, 32.3, 18.9, 34.5, 18.9, 12.3] }
      ];
      const futureLabels = [&#x27;8月&#x27;, &#x27;9月&#x27;, &#x27;10月&#x27;, &#x27;11月&#x27;, &#x27;12月&#x27;, &#x27;27·1月&#x27;, &#x27;2月&#x27;, &#x27;3月&#x27;, &#x27;4月&#x27;, &#x27;5月&#x27;, &#x27;6月&#x27;, &#x27;7月&#x27;];
      const scenarios = {
        expert: {
          n: [28, 29, 27, 30, 31, 29, 32, 31, 33, 32, 34, 35],
          target: { learning: 12, work: 36, venture: 5, creation: 39, life: 8 },
          nodes: [
            { month: 9, key: &#x27;creation&#x27;, text: &#x27;沉淀一套创作方法&#x27;, detail: &#x27;把数据分析、视觉表达和叙事过程整理成可复用的步骤、模板与判断标准，并用真实作品持续校正。&#x27; },
            { month: 14, key: &#x27;work&#x27;, text: &#x27;主导一次高影响项目&#x27;, detail: &#x27;主动承担一个能够同时体现业务理解、数据能力和表达能力的关键项目，让方法真正转化为组织影响力。&#x27; }
          ]
        },
        creator: {
          n: [27, 26, 28, 29, 27, 30, 31, 29, 32, 33, 34, 36],
          target: { learning: 7, work: 12, venture: 10, creation: 58, life: 13 },
          nodes: [
            { month: 9, key: &#x27;creation&#x27;, text: &#x27;保持稳定周更&#x27;, detail: &#x27;建立能够连续执行的选题、制作和发布节奏，用持续作品而不是偶发爆款验证内容方向。&#x27; },
            { month: 14, key: &#x27;creation&#x27;, text: &#x27;验证可重复付费合作&#x27;, detail: &#x27;关注主动咨询、复访和付费合作是否连续发生；只有收入来源能够重复，才逐步降低主业投入。&#x27; }
          ]
        },
        later: {
          n: [26, 25, 27, 28, 26, 29, 30, 28, 31, 32, 33, 34],
          target: { learning: 12, work: 18, venture: 35, creation: 22, life: 13 },
          nodes: [
            { month: 9, key: &#x27;venture&#x27;, text: &#x27;完成 3–5 人验证&#x27;, detail: &#x27;邀请少量真实用户自愿提供个人数据，验证结果是否准确、是否建立隐私信任，以及是否愿意继续使用。&#x27; },
            { month: 14, key: &#x27;venture&#x27;, text: &#x27;形成可重复交付&#x27;, detail: &#x27;把半人工服务整理成稳定流程，观察交付成本、复购或转介绍和真实付费意愿，再决定是否产品化。&#x27; }
          ]
        }
      };
      let predictionOpen = false;
      let activeScenario = &#x27;expert&#x27;;
      let months = historyMonths;
      let series = historySeries;

      function projectedValues(item, target, phase) {
        const start = item.values[item.values.length - 1];
        return Array.from({ length: 12 }, (_, index) =&gt; {
          const t = (index + 1) / 12;
          const eased = t * t * (3 - 2 * t);
          const wave = Math.sin((index + 1) * Math.PI / 3 + phase) * 1.1 * (1 - t);
          return Math.max(0, start + (target - start) * eased + wave);
        });
      }

      function useScenario(key) {
        activeScenario = key;
        const scenario = scenarios[key];
        const forecast = historySeries.map((item, index) =&gt; ({
          ...item,
          values: projectedValues(item, scenario.target[item.key], index)
        }));
        for (let monthIndex = 0; monthIndex &lt; 12; monthIndex += 1) {
          const total = forecast.reduce((sum, item) =&gt; sum + item.values[monthIndex], 0);
          forecast.forEach((item) =&gt; { item.values[monthIndex] = item.values[monthIndex] / total * 100; });
        }
        months = [...historyMonths, ...futureLabels.map((label, index) =&gt; ({ label, n: scenario.n[index], forecast: true }))];
        series = historySeries.map((item, index) =&gt; ({
          ...item,
          values: [...item.values, ...forecast[index].values]
        }));
      }
      const milestones = [
        { month: 0, key: &#x27;work&#x27;, lines: [&#x27;开始适应&#x27;, &#x27;负责人角色&#x27;], dx: 10, dy: 3 },
        { month: 4, key: &#x27;creation&#x27;, lines: [&#x27;数字艺术&#x27;, &#x27;第一个小爆款&#x27;], dx: 10, dy: 4.67 },
        { month: 6, key: &#x27;venture&#x27;, lines: [&#x27;「另世我」产品规划&#x27;], dx: -4, dy: 0 },
        { month: 6, key: &#x27;creation&#x27;, lines: [&#x27;第二个小爆款&#x27;], dx: -10, dy: -8 },
        { month: 6, key: &#x27;learning&#x27;, lines: [&#x27;统计学学习&#x27;], dx: -58, dy: 0, nodeDy: 12 },
        { month: 6, key: &#x27;learning&#x27;, lines: [&#x27;炒股学习&#x27;], dx: -8, dy: 0, nodeDy: 12 }
      ];
      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
      const settingMap = {
        &#x27;divider-width&#x27;: { variable: &#x27;--dr-divider-width&#x27;, unit: &#x27;&#x27;, displayUnit: &#x27; px&#x27; },
        &#x27;divider-color&#x27;: { variable: &#x27;--dr-divider-color&#x27;, unit: &#x27;&#x27; },
        &#x27;band-text-color&#x27;: { variable: &#x27;--dr-band-text-color&#x27;, unit: &#x27;&#x27; },
        &#x27;band-font-size&#x27;: { variable: &#x27;--dr-band-font-size&#x27;, unit: &#x27;px&#x27;, displayUnit: &#x27; px&#x27; },
        &#x27;event-font-size&#x27;: { variable: &#x27;--dr-event-font-size&#x27;, unit: &#x27;px&#x27;, displayUnit: &#x27; px&#x27; },
        &#x27;event-text-color&#x27;: { variable: &#x27;--dr-event-text-color&#x27;, unit: &#x27;&#x27; },
        &#x27;event-text-opacity&#x27;: { variable: &#x27;--dr-event-text-opacity&#x27;, unit: &#x27;&#x27;, format: (value) =&gt; `${Math.round(Number(value) * 100)}%` },
        &#x27;event-bg-opacity&#x27;: { variable: &#x27;--dr-event-bg-opacity&#x27;, unit: &#x27;&#x27;, format: (value) =&gt; `${Math.round(Number(value) * 100)}%` },
        &#x27;work-color&#x27;: { variable: &#x27;--dr-work&#x27;, unit: &#x27;&#x27; },
        &#x27;creation-color&#x27;: { variable: &#x27;--dr-creation&#x27;, unit: &#x27;&#x27; },
        &#x27;venture-color&#x27;: { variable: &#x27;--dr-venture&#x27;, unit: &#x27;&#x27; },
        &#x27;learning-color&#x27;: { variable: &#x27;--dr-learning&#x27;, unit: &#x27;&#x27; },
        &#x27;life-color&#x27;: { variable: &#x27;--dr-life&#x27;, unit: &#x27;&#x27; }
      };

      function el(tag, attrs = {}, text = &#x27;&#x27;) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, String(value)));
        if (text) node.textContent = text;
        return node;
      }

      function smooth(points) {
        let d = `M${points[0][0]},${points[0][1]}`;
        for (let i = 0; i &lt; points.length - 1; i += 1) {
          const p0 = points[i - 1] || points[i];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[i + 2] || p2;
          const c1x = p1[0] + (p2[0] - p0[0]) / 6;
          const c1y = p1[1] + (p2[1] - p0[1]) / 6;
          const c2x = p2[0] - (p3[0] - p1[0]) / 6;
          const c2y = p2[1] - (p3[1] - p1[1]) / 6;
          d += ` C${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
        }
        return d;
      }

      let revealFrame = 0;
      let revealComplete = false;
      const reduceMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;

      function draw() {
        hideNodePopover();
        if (revealFrame) cancelAnimationFrame(revealFrame);
        const width = Math.max(320, Math.round(host.getBoundingClientRect().width || 720));
        const compact = width &lt; 380;
        const availableHeight = Math.round(host.getBoundingClientRect().height || 0);
        const height = Math.max(compact ? 280 : 360, availableHeight);
        const margin = compact
          ? { top: 18, right: 10, bottom: 62, left: 10 }
          : { top: 32, right: 24, bottom: 76, left: 24 };
        const plotW = width - margin.left - margin.right;
        const plotH = height - margin.top - margin.bottom;
        const top = margin.top;
        const bottom = top + plotH;
        const xs = months.map((_, i) =&gt; margin.left + (plotW * i) / (months.length - 1));
        const centerY = top + plotH / 2;
        const svg = el(&#x27;svg&#x27;, {
          viewBox: `0 0 ${width} ${height}`,
          role: &#x27;img&#x27;,
          &#x27;aria-labelledby&#x27;: &#x27;dr26-title dr26-desc&#x27;
        });
        host.replaceChildren(svg);
        svg.appendChild(el(&#x27;title&#x27;, { id: &#x27;dr26-title&#x27; }, &#x27;时间都去哪儿了？&#x27;));
        svg.appendChild(el(&#x27;desc&#x27;, { id: &#x27;dr26-desc&#x27; }, &#x27;河流围绕水平中轴展开，总宽度表示当月可归类日记数量的平方根缩放，内部颜色表示五类人生场景的相对份额。&#x27;));

        const clipId = &#x27;dr26-river-reveal&#x27;;
        const defs = el(&#x27;defs&#x27;);
        const clip = el(&#x27;clipPath&#x27;, { id: clipId });
        const revealRect = el(&#x27;rect&#x27;, {
          x: margin.left,
          y: 0,
          width: revealComplete ? plotW : 0,
          height
        });
        clip.appendChild(revealRect);
        defs.appendChild(clip);
        svg.appendChild(defs);
        const riverGroup = el(&#x27;g&#x27;, {
          class: `dr-river-group${revealComplete &amp;&amp; !reduceMotion ? &#x27; is-breathing&#x27; : &#x27;&#x27;}`,
          &#x27;clip-path&#x27;: `url(#${clipId})`
        });
        svg.appendChild(riverGroup);

        const bounds = {};
        const monthTotals = months.map((_, index) =&gt; series.reduce((sum, item) =&gt; sum + item.values[index], 0));
        const roots = months.map((month) =&gt; Math.sqrt(month.n));
        const minRoot = Math.min(...roots);
        const maxRoot = Math.max(...roots);
        const totalHeights = roots.map((value) =&gt; {
          const normalized = maxRoot === minRoot ? 1 : (value - minRoot) / (maxRoot - minRoot);
          return plotH * (0.35 + normalized * 0.55);
        });
        const cumulative = totalHeights.map((value) =&gt; -value / 2);
        series.forEach((item) =&gt; {
          const normalized = item.values.map((value, index) =&gt; value / monthTotals[index]);
          const thickness = normalized.map((value, index) =&gt; value * totalHeights[index]);
          const upper = xs.map((x, i) =&gt; [x, centerY + cumulative[i]]);
          const lower = xs.map((x, i) =&gt; [x, centerY + cumulative[i] + thickness[i]]);
          bounds[item.key] = { lower, upper };
          const reversed = [...lower].reverse();
          const path = el(&#x27;path&#x27;, {
            class: &#x27;dr-layer&#x27;,
            fill: item.color,
            d: `${smooth(upper)} L${reversed[0][0]},${reversed[0][1]} ${smooth(reversed).replace(/^M[^C]+/, &#x27;&#x27;)} Z`
          });
          path.appendChild(el(&#x27;title&#x27;, {}, `${item.label}：${item.values.join(&#x27;%、&#x27;)}%`));
          riverGroup.appendChild(path);
          thickness.forEach((value, i) =&gt; { cumulative[i] += value; });
        });

        const bandLabels = predictionOpen
          ? [
              { key: &#x27;learning&#x27;, month: 3, text: &#x27;学习&#x27; },
              { key: &#x27;work&#x27;, month: 3, text: &#x27;工作&#x27; },
              { key: &#x27;creation&#x27;, month: 3, text: &#x27;个人创作&#x27;, dy: 2 },
              { key: &#x27;life&#x27;, month: 4, text: &#x27;生活与关系&#x27;, dy: 10 }
            ]
          : compact
            ? [
                { key: &#x27;work&#x27;, month: 3, text: &#x27;工作&#x27; },
                { key: &#x27;creation&#x27;, month: 3, text: &#x27;个人创作&#x27; },
                { key: &#x27;life&#x27;, month: 4, text: &#x27;生活与关系&#x27;, dy: 12 }
              ]
            : [
                { key: &#x27;learning&#x27;, month: 3, text: &#x27;学习&#x27; },
                { key: &#x27;work&#x27;, month: 3, text: &#x27;工作&#x27; },
                { key: &#x27;creation&#x27;, month: 3, text: &#x27;个人创作&#x27;, dy: 2 },
                { key: &#x27;life&#x27;, month: 4, text: &#x27;生活与关系&#x27;, dy: 12 }
              ];
        bandLabels.forEach((item) =&gt; {
          const band = bounds[item.key];
          const y = (band.lower[item.month][1] + band.upper[item.month][1]) / 2 + 4 + (item.dy || 0);
          riverGroup.appendChild(el(&#x27;text&#x27;, {
            class: &#x27;dr-band-label text-small&#x27;, x: xs[item.month] + (item.dx || 0), y, &#x27;text-anchor&#x27;: &#x27;middle&#x27;
          }, item.text));
        });

        const activeMilestones = predictionOpen
          ? []
          : compact
            ? milestones.filter((item) =&gt; item.month === 0 || (item.month === 6 &amp;&amp; item.key === &#x27;creation&#x27;))
            : milestones;
        activeMilestones.forEach((item) =&gt; {
          const band = bounds[item.key];
          const x = xs[item.month] + item.dx;
          const y = (band.lower[item.month][1] + band.upper[item.month][1]) / 2;
          const nodeY = y + (item.nodeDy || 0);
          const anchor = item.month &gt;= 6 ? &#x27;end&#x27; : item.month === 0 ? &#x27;start&#x27; : &#x27;middle&#x27;;
          const tx = item.month &gt;= 6 ? x - 8 : item.month === 0 ? x + 8 : x;
          const eventFontSize = parseFloat(getComputedStyle(root).getPropertyValue(&#x27;--dr-event-font-size&#x27;)) || 12;
          const lineHeight = eventFontSize + 2;
          const centeredY = nodeY + item.dy - ((item.lines.length - 1) * lineHeight) / 2 + 4;
          const text = el(&#x27;text&#x27;, {
            class: &#x27;dr-event-text text-small&#x27;, x: tx, y: centeredY, &#x27;text-anchor&#x27;: anchor
          });
          item.lines.forEach((line, index) =&gt; {
            const span = el(&#x27;tspan&#x27;, { x: tx, dy: index === 0 ? 0 : lineHeight }, line);
            text.appendChild(span);
          });
          riverGroup.appendChild(text);
          const textBox = text.getBBox();
          const padX = 5;
          const padY = 3;
          const background = el(&#x27;rect&#x27;, {
            class: &#x27;dr-event-bg&#x27;,
            x: textBox.x - padX,
            y: textBox.y - padY,
            width: textBox.width + padX * 2,
            height: textBox.height + padY * 2,
            rx: 3
          });
          riverGroup.insertBefore(background, text);
          const dotX = anchor === &#x27;middle&#x27; ? textBox.x + textBox.width + 8 : x;
          const dotY = textBox.y + textBox.height / 2;
          riverGroup.appendChild(el(&#x27;circle&#x27;, { class: &#x27;dr-event-dot&#x27;, cx: dotX, cy: dotY, r: compact ? 2.5 : 3 }));
        });

        if (predictionOpen) {
          scenarios[activeScenario].nodes.forEach((item, index) =&gt; {
            const band = bounds[item.key];
            const x = xs[item.month];
            const nodeY = (band.lower[item.month][1] + band.upper[item.month][1]) / 2;
            const anchor = index === 0 ? &#x27;start&#x27; : &#x27;end&#x27;;
            const textX = x + (index === 0 ? 5 : -5);
            const group = el(&#x27;g&#x27;, {
              class: &#x27;dr-future-node&#x27;,
              role: &#x27;button&#x27;,
              tabindex: &#x27;0&#x27;,
              &#x27;aria-label&#x27;: `${item.text}，点击查看解释`
            });
            group.appendChild(el(&#x27;circle&#x27;, {
              class: &#x27;dr-future-dot&#x27;, cx: x, cy: nodeY, r: compact ? 2.8 : 3.4
            }));
            group.appendChild(el(&#x27;text&#x27;, {
              class: &#x27;dr-future-text text-small&#x27;, x: textX, y: nodeY + 2.5, &#x27;text-anchor&#x27;: anchor
            }, item.text));
            const openPopover = () =&gt; showNodePopover(item, group);
            group.addEventListener(&#x27;click&#x27;, openPopover);
            group.addEventListener(&#x27;keydown&#x27;, (event) =&gt; {
              if (event.key === &#x27;Enter&#x27; || event.key === &#x27; &#x27;) {
                event.preventDefault();
                openPopover();
              }
            });
            riverGroup.appendChild(group);
          });
        }

        if (!revealComplete) {
          if (reduceMotion) {
            revealRect.setAttribute(&#x27;width&#x27;, String(plotW));
            revealComplete = true;
          } else {
            const duration = 2600;
            const startedAt = performance.now();
            const animateReveal = (now) =&gt; {
              if (!revealRect.isConnected) return;
              const progress = Math.min(1, (now - startedAt) / duration);
              const eased = 1 - Math.pow(1 - progress, 3);
              revealRect.setAttribute(&#x27;width&#x27;, String(plotW * eased));
              if (progress &lt; 1) {
                revealFrame = requestAnimationFrame(animateReveal);
              } else {
                revealFrame = 0;
                revealComplete = true;
                riverGroup.classList.add(&#x27;is-breathing&#x27;);
              }
            };
            revealFrame = requestAnimationFrame(animateReveal);
          }
        }

        svg.appendChild(el(&#x27;line&#x27;, { class: &#x27;dr-axis&#x27;, x1: margin.left, y1: bottom + 16, x2: width - margin.right, y2: bottom + 16 }));
        if (predictionOpen) {
          const nowX = (xs[6] + xs[7]) / 2;
          svg.appendChild(el(&#x27;line&#x27;, { class: &#x27;dr-now-line&#x27;, x1: nowX, y1: top - 8, x2: nowX, y2: bottom + 8 }));
          svg.appendChild(el(&#x27;text&#x27;, { class: &#x27;dr-now-label text-small&#x27;, x: nowX - 4, y: top - 12, &#x27;text-anchor&#x27;: &#x27;end&#x27; }, &#x27;现在&#x27;));
          svg.appendChild(el(&#x27;text&#x27;, { class: &#x27;dr-forecast-label text-small&#x27;, x: nowX + 5, y: top - 12 }, &#x27;未来一年 · 行为情景推演&#x27;));
        }
        months.forEach((month, i) =&gt; {
          const show = predictionOpen
            ? i === 0 || i === 2 || i === 4 || i === 6 || i === 8 || i === 10 || i === 12 || i === 14 || i === 16 || i === 18
            : !compact || i === 0 || i === 2 || i === 4 || i === 6;
          if (!show) return;
          svg.appendChild(el(&#x27;line&#x27;, { class: &#x27;dr-tick&#x27;, x1: xs[i], y1: bottom + 16, x2: xs[i], y2: bottom + 22 }));
          svg.appendChild(el(&#x27;text&#x27;, { class: &#x27;dr-month text-small&#x27;, x: xs[i], y: bottom + 42, &#x27;text-anchor&#x27;: &#x27;middle&#x27; }, month.label));
          if (!predictionOpen) {
            svg.appendChild(el(&#x27;text&#x27;, { class: &#x27;dr-count text-small&#x27;, x: xs[i], y: bottom + 60, &#x27;text-anchor&#x27;: &#x27;middle&#x27; }, `n=${month.n}`));
          }
        });
        if (!compact) {
          svg.appendChild(el(&#x27;text&#x27;, { class: &#x27;dr-axis-label text-small&#x27;, x: 9, y: centerY, &#x27;text-anchor&#x27;: &#x27;middle&#x27;, transform: `rotate(-90 9 ${centerY})` }, &#x27;当月记录强度（√n）&#x27;));
        }
      }

      let observedWidth = -1;
      let observedHeight = -1;
      let resizeFrame = 0;
      const observer = new ResizeObserver((entries) =&gt; {
        const rect = entries[0]?.contentRect;
        if (!rect) return;
        const nextWidth = Math.round(rect.width);
        const nextHeight = Math.round(rect.height);
        if (nextWidth === observedWidth &amp;&amp; nextHeight === observedHeight) return;
        observedWidth = nextWidth;
        observedHeight = nextHeight;
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() =&gt; {
          resizeFrame = 0;
          draw();
        });
      });
      const initialRect = host.getBoundingClientRect();
      observedWidth = Math.round(initialRect.width);
      observedHeight = Math.round(initialRect.height);
      observer.observe(host);
      root.querySelectorAll(&#x27;[data-setting]&#x27;).forEach((input) =&gt; {
        input.addEventListener(&#x27;input&#x27;, () =&gt; {
          const config = settingMap[input.dataset.setting];
          if (!config) return;
          root.style.setProperty(config.variable, `${input.value}${config.unit}`);
          const output = root.querySelector(`[data-value-for=&quot;${input.dataset.setting}&quot;]`);
          if (output) output.textContent = config.format
            ? config.format(input.value)
            : `${input.value}${config.displayUnit || &#x27;&#x27;}`;
          draw();
        });
      });
      root.querySelector(&#x27;[data-replay]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {
        revealComplete = false;
        draw();
      });
      root.querySelector(&#x27;[data-node-popover-close]&#x27;)?.addEventListener(&#x27;click&#x27;, hideNodePopover);
      root.querySelector(&#x27;[data-predict]&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {
        predictionOpen = !predictionOpen;
        root.classList.toggle(&#x27;is-predicting&#x27;, predictionOpen);
        const trigger = root.querySelector(&#x27;[data-predict]&#x27;);
        if (trigger) trigger.textContent = predictionOpen ? &#x27;取消预测&#x27; : &#x27;预个测&#x27;;
        if (predictionOpen) {
          useScenario(activeScenario);
        } else {
          months = historyMonths;
          series = historySeries;
        }
        revealComplete = false;
        draw();
      });
      root.querySelector(&#x27;[data-scenario-select]&#x27;)?.addEventListener(&#x27;change&#x27;, (event) =&gt; {
        if (predictionOpen) {
          useScenario(event.currentTarget.value);
          revealComplete = false;
          draw();
        }
      });
      draw();
    })();
  &lt;/script&gt;
&lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
