 data.themes.forEach((t,ti)=>{let nodes=(data.milestones||[]).map((m,i)=>({...m,i})).filter(m=>m.themeKey===t.key&&!hidden(itemId('milestone',m.i))).slice(0,2);if(!nodes.length){const pi=Math.min(data.periods.length-1,Math.max(0,Math.round(ti*(data.periods.length-1)/Math.max(1,data.themes.length-1))));nodes=[{periodIndex:pi,label:t.label,i:-1}]};nodes.forEach((m,ni)=>{const pi=m.periodIndex,x=(bounds[ti][pi][0]+bounds[ti+1][pi][0])/2,y=top+pi/Math.max(1,data.periods.length-1)*(bottom-top),g=make('g',{class:'milestone-dot'});g.append(make('circle',{cx:x,cy:y,r:5}),make('text',{x,y:y-11-(ni*2),'text-anchor':'middle'},m.label));svg.appendChild(g)})})}
function bind(){app.onclick=e=>{const c=e.target.closest('[data-confirm]');if(c){change(()=>{review.confirmed=review.confirmed.includes(c.dataset.confirm)?review.confirmed.filter(x=>x!==c.dataset.confirm):[...review.confirmed,c.dataset.confirm];review.hidden=review.hidden.filter(x=>x!==c.dataset.confirm)});return}const h=e.target.closest('[data-hide]');if(h){change(()=>{if(!review.hidden.includes(h.dataset.hide))review.hidden.push(h.dataset.hide)});return}const f=e.target.closest('[data-feedback]');if(f){openFeedback(f.dataset.feedback);return}const letter=e.target.closest('[data-letter]');if(letter){generateLetter(letter.dataset.letter);return}const platform=e.target.closest('[data-platform]');if(platform){sharePlatform=platform.dataset.platform;document.querySelectorAll('[data-platform]').forEach(x=>x.classList.toggle('active',x.dataset.platform===sharePlatform));renderShare();return}if(e.target.closest('#downloadShare'))downloadShare();if(e.target.closest('#copyShare'))copyShare()}}
function change(fn){fn();save();render()}function save(){try{sessionStorage.setItem('anotherSelfResult',JSON.stringify(state))}catch{}}
function openFeedback(id){feedbackTarget=id;document.querySelector('#feedback').classList.add('open');document.querySelector('#feedbackText').value=review.feedback[id]||'';document.querySelector('#feedbackText').focus()}
document.querySelector('#closeFeedback').onclick=()=>document.querySelector('#feedback').classList.remove('open');document.querySelector('#feedbackForm').onsubmit=async e=>{e.preventDefault();const feedback=document.querySelector('#feedbackText').value.trim(),status=document.querySelector('#feedbackStatus'),[kind,indexText]=feedbackTarget.split(':'),index=Number(indexText),current=data[`${kind}s`]?.[index];status.textContent='正在只重新分析这一部分…';try{if(!state.apiUrl||!state.sourceText)throw new Error('下载版不包含原始记录，无法重新分析');const res=await fetch(state.apiUrl,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'review',module:kind,current,feedback,diary:state.sourceText,context:{periods:data.periods,themes:data.themes}})}),payload=await res.json();if(!res.ok)throw new Error(payload.error||'局部分析失败');data[`${kind}s`][index]=payload.result;review.feedback[feedbackTarget]=feedback;document.querySelector('#feedback').classList.remove('open');save();render()}catch(err){status.textContent=err.message}};
async function generateLetter(author){letterAuthor=author;document.querySelectorAll('[data-letter]').forEach(x=>x.classList.toggle('active',x.dataset.letter===author));const status=document.querySelector('#letterStatus'),text=document.querySelector('#letterText'),role=bestRole();status.textContent='正在从你的记录里整理这封信…';text.textContent='';if(author==='past'){await new Promise(r=>setTimeout(r,550));text.textContent=data.letters?.past||data.letter||'这批记录还不足以写出一封可靠的信。';status.textContent='过去的自己，写给此刻的你。';return}try{if(data.letters?.role){text.textContent=data.letters.role;status.textContent=`${role.name}，写给此刻的你。`;return}if(!state.apiUrl||!state.sourceText)throw new Error('请在联网生成页完成这封信后再下载私密网页');const res=await fetch(state.apiUrl,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'letter',diary:state.sourceText,author:role,insights:data.insights,themes:data.themes,nickname:state.nickname})}),payload=await res.json();if(!res.ok)throw new Error(payload.error||'信件生成失败');data.letters=data.letters||{};data.letters.role=payload.result.letter;save();text.textContent=data.letters.role;status.textContent=`${role.name}，写给此刻的你。`}catch(err){status.textContent=err.message;text.textContent='信纸暂时空着。'}}
function shareText(){const top=data.themes.slice().sort((a,b)=>(b.shares.at(-1)||0)-(a.shares.at(-1)||0))[0],ins=(data.insights||[]).filter((_,i)=>!hidden(itemId('insight',i)))[0];return sharePlatform==='xhs'?`我把一段生活记录，养成了一个“另世我”。\n\n她的身体由不同主题的时间河流组成。最近最宽的一条是「${top?.label||'生活'}」，而我最意外看见的是：${ins?.title||'有些变化，只有回看时才会出现'}。\n\n这不是人生结论，只是一次有证据边界的回望。\n\n#另世我 #日记可视化 #人生复盘 #数字生命`:`我把过去的生活记录，变成了一个会呼吸的另世我。\n最宽的河流是「${top?.label||'生活'}」。\n原来时间没有消失，它只是长成了现在的我。\n#另世我 #人生可视化 #我的数字分身`}
function renderShare(){const canvas=document.querySelector('#shareCanvas');if(!canvas)return;canvas.width=1080;canvas.height=sharePlatform==='xhs'?1350:1920;canvas.style.aspectRatio=sharePlatform==='xhs'?'4/5':'9/16';const ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height,g=ctx.createLinearGradient(0,0,w,h);g.addColorStop(0,'#fff2fb');g.addColorStop(1,'#dcb8dd');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='#43234e';ctx.font='700 28px sans-serif';ctx.fillText('ANOTHER SELF · 出生照',72,90);ctx.font='500 68px serif';wrap(ctx,data.title,72,190,w-144,82);const themes=data.themes,barY=h*.46,maxW=w-190;themes.forEach((t,i)=>{const y=barY+i*78,val=t.shares.at(-1)||0;ctx.fillStyle=t.color;roundRect(ctx,95,y,Math.max(110,maxW*val/100),48,22);ctx.fillStyle='#43234e';ctx.font='600 25px sans-serif';ctx.fillText(`${t.label}  ${val.toFixed(0)}%`,110,y-14)});ctx.fillStyle='#43234e';ctx.font='500 32px serif';wrap(ctx,'时间没有消失，\n它只是长成了现在的我。',72,h-210,w-144,48);ctx.font='400 20px sans-serif';ctx.fillStyle='#78687b';ctx.fillText('基于个人记录生成 · 分享前请检查隐私',72,h-70);document.querySelector('#shareTitle').textContent=sharePlatform==='xhs'?'小红书配文':'抖音配文';document.querySelector('#shareCopy').textContent=shareText();canvas.toBlob(b=>{if(shareUrl)URL.revokeObjectURL(shareUrl);shareUrl=URL.createObjectURL(b)})}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function wrap(ctx,text,x,y,w,line){let s='',yy=y;for(const ch of text){if(ch==='\n'||ctx.measureText(s+ch).width>w){ctx.fillText(s,x,yy);s=ch==='\n'?'':ch;yy+=line}else s+=ch}if(s)ctx.fillText(s,x,yy)}function downloadShare(){const a=document.createElement('a');a.href=shareUrl;a.download=`另世我-${sharePlatform==='xhs'?'小红书':'抖音'}-${new Date().toISOString().slice(0,10)}.png`;a.click()}async function copyShare(){await navigator.clipboard.writeText(shareText());document.querySelector('#copyStatus').textContent='文案已复制。'}
function exportState(){const clean=JSON.parse(JSON.stringify(state));clean.sourceText='';clean.apiUrl='';clean.reviewState.history=[];return clean}function downloadableDocument(){const clone=document.documentElement.cloneNode(true),embedded=clone.ownerDocument.createElement('script');embedded.id='embeddedResult';embedded.type='application/json';embedded.textContent=JSON.stringify(exportState()).replace(/</g,'\\u003c');clone.querySelector('body').prepend(embedded);return '<!doctype html>\n'+clone.outerHTML}function download(){const blob=new Blob([downloadableDocument()],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`另世我-${state.nickname}-${new Date().toISOString().slice(0,10)}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#download').onclick=download;render();
})();
