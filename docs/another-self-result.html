<style>

order:1px solid var(--line);border-radius:19px;background:rgba(255,252,255,.62)}.milestone time{color:var(--muted);font-size:11px}.milestone h3,.insight h3,.path h3{margin:0;font:600 20px/1.35 ui-serif,Georgia,"Songti SC",serif}.milestone p,.insight p,.path p{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.evidence{padding-left:12px;border-left:2px solid var(--accent)}.review{display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}.review button{padding:6px 9px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.review button.confirmed{color:var(--ok);border-color:var(--ok)}.insights{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.insight{padding:23px;border:1px solid var(--line);border-radius:20px;background:rgba(255,252,255,.62)}.type{display:inline-block;margin-bottom:13px;color:#965a91;font-size:10px;font-weight:800;letter-spacing:.12em}.future-shell{padding:70px max(24px,calc((100% - 1100px)/2));color:#f9eef8;background:linear-gradient(145deg,#34203e,#63306f 62%,#9a5996)}.future-shell .section-kicker,.future-shell .section-head p{color:#d9bed9}.paths{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.path{padding:23px;border:1px solid rgba(255,255,255,.16);border-radius:20px;background:rgba(255,255,255,.07);cursor:pointer}.path.active{border-color:#fff;background:rgba(255,255,255,.14)}.path p{color:#d9c5dc}.path dl{display:grid;gap:10px;margin:17px 0}.path dt{color:#caa9cf;font-size:9px;letter-spacing:.12em}.path dd{margin:3px 0 0;font-size:12px;line-height:1.55}.role-models{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.role{padding:17px;border-left:2px solid #e2bddf;background:rgba(255,255,255,.07)}.role h4{margin:0}.role p{margin:7px 0;color:#d9c5dc;font-size:11px;line-height:1.6}.role a{color:#fff;font-size:10px}.next-action{margin-top:20px;padding:20px;border:1px solid rgba(255,255,255,.25);border-radius:16px}.next-action small{color:#d9c5dc}.next-action strong{display:block;margin-top:8px;font:500 19px/1.45 ui-serif,Georgia,"Songti SC",serif}.letter{width:min(920px,calc(100% - 32px));margin:90px auto;padding:clamp(30px,6vw,70px);border-radius:28px;background:rgba(255,252,255,.7);box-shadow:0 28px 90px rgba(69,31,79,.11)}.letter h2{margin:8px 0 24px;font:500 clamp(34px,5vw,56px)/1.15 ui-serif,Georgia,"Songti SC",serif}.letter-text{white-space:pre-wrap;font:400 16px/2 ui-serif,Georgia,"Songti SC",serif}.audit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:34px}.audit div{padding:15px;border:1px solid var(--line);border-radius:14px}.audit strong{display:block;font-size:22px}.audit span{color:var(--muted);font-size:10px}.privacy{margin-top:18px;padding:16px;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:11px;line-height:1.7}.end-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.river-band{cursor:pointer;transition:opacity .25s,filter .25s,d .45s}.river-band.muted{opacity:.12}.river-band.active{filter:drop-shadow(0 7px 12px rgba(62,35,72,.25))}.milestone-dot{cursor:pointer}.milestone-dot text{font-size:10px;font-weight:750;paint-order:stroke;stroke:rgba(255,255,255,.9);stroke-width:4px}.milestone-dot circle{fill:#fff;stroke:var(--ink);stroke-width:1.3}.hidden-item{display:none!important}.feedback{position:fixed;z-index:50;inset:0;display:none;place-items:center;padding:20px;background:rgba(48,26,54,.35);backdrop-filter:blur(8px)}.feedback.open{display:grid}.feedback-card{width:min(520px,100%);padding:26px;border-radius:22px;background:var(--paper);box-shadow:0 25px 90px rgba(44,20,51,.25)}.feedback-card h2{margin:0;font:500 27px/1.3 ui-serif,Georgia,"Songti SC",serif}.feedback-card textarea{width:100%;min-height:120px;margin:16px 0;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical}.status{min-height:18px;color:var(--warn);font-size:11px}.empty{max-width:600px;margin:120px auto;padding:40px;border-radius:24px;background:#fff;text-align:center}.empty a{color:var(--ink)}

<header class="top"><a class="back" href="generate-another-self.html">← 重新生成</a><div class="actions"><button class="button secondary" id="undo" hidden>撤销修改</button><button class="button secondary" id="print">存为 PDF</button><button class="button primary" id="download">下载私密网页</button></div></header>
<main id="app"></main>
<div class="feedback" id="feedback" role="dialog" aria-modal="true"><form class="feedback-card" id="feedbackForm"><p class="section-kicker">HELP IT UNDERSTAND YOU</p><h2>哪里没有理解准确？</h2><p class="boundary">补充一句原因后，只会重新分析这一部分；其他已经确认的内容不会改变。</p><textarea id="feedbackText" required placeholder="例如：这段时间不是我放弃了创作，而是工作太忙暂时没有记录……"></textarea><p class="status" id="feedbackStatus"></p><div class="end-actions"><button class="button primary" type="submit">局部重新分析</button><button class="button" type="button" id="closeFeedback">取消</button></div></form></div>
<script>
(() => {
const app=document.querySelector('#app'),embedded=document.querySelector('#embeddedResult')?.textContent||'';let stored='';try{stored=sessionStorage.getItem('anotherSelfResult')||''}catch{}const raw=stored||embedded;if(!raw){app.innerHTML='<section class="empty"><h1>这里还没有另世我</h1><p>请先上传生活记录并完成生成。</p><a href="generate-another-self.html">开始生成 →</a></section>';return}
const state=JSON.parse(raw),data=state.result,review=state.reviewState||(state.reviewState={confirmed:[],hidden:[],feedback:{},history:[]});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeLabels={repeating:'反复出现',growing:'正在增强',compressed:'正在被挤压',tension:'尚未解决的拉扯'};let selectedTheme=data.themes[0]?.key,selectedPeriod=Math.max(0,data.periods.length-1),futureMode=false,selectedPath=data.futurePaths?.[0]?.key||'',feedbackTarget=null;
const itemId=(kind,index)=>`${kind}:${index}`;const hidden=id=>review.hidden.includes(id);const confirmed=id=>review.confirmed.includes(id);
function coverageText(){const c=data.coverage||{};return [c.range||`${data.periods[0]}—${data.periods.at(-1)}`,`${c.fileCount||0} 个文件`,`${(c.characterCount||0).toLocaleString()} 个有效字符`].map(x=>`<span>${esc(x)}</span>`).join('')}
function reviewButtons(kind,index){const id=itemId(kind,index);return `<div class="review" data-review="${id}"><button data-confirm="${id}" class="${confirmed(id)?'confirmed':''}">${confirmed(id)?'✓ 已确认':'准确'}</button><button data-feedback="${id}">不准确</button><button data-hide="${id}">隐藏</button></div>`}
function render(){
 const milestones=(data.milestones||[]).map((m,i)=>`<article class="milestone ${hidden(itemId('milestone',i))?'hidden-item':''}" data-item="${itemId('milestone',i)}"><time>${esc(data.periods[m.periodIndex]||'阶段未明')}</time><div><h3>${esc(m.label)}</h3><p class="evidence">记录依据：${esc(m.evidence||'本次记录中的相关文字特征')}</p><p>${esc(m.meaning||'这是一条需要由你核对的阶段变化。')}</p></div>${reviewButtons('milestone',i)}</article>`).join(''),gapText=(data.coverage?.gaps||[]).length?` 已知缺口：${esc(data.coverage.gaps.join('、'))}。`:'';
 const insights=(data.insights||[]).map((x,i)=>`<article class="insight ${hidden(itemId('insight',i))?'hidden-item':''}" data-item="${itemId('insight',i)}"><span class="type">${esc(typeLabels[x.type]||typeLabels.repeating)}</span><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><p class="evidence">依据：${esc((x.evidenceRefs||[]).join('；')||'本次记录中的重复特征')}</p>${reviewButtons('insight',i)}</article>`).join('');
 const paths=(data.futurePaths||[]).map((p,i)=>`<article class="path ${p.key===selectedPath?'active':''} ${hidden(itemId('futurePath',i))?'hidden-item':''}" data-path="${esc(p.key)}" data-item="${itemId('futurePath',i)}"><span class="type">情景 0${i+1}</span><h3>${esc(p.title)}</h3><p>${esc(p.premise)}</p><dl><div><dt>需要的条件</dt><dd>${esc((p.conditions||[]).join('；')||'需要继续观察')}</dd></div><div><dt>可能获得</dt><dd>${esc(p.gain)}</dd></div><div><dt>需要付出</dt><dd>${esc(p.cost)}</dd></div></dl>${reviewButtons('futurePath',i)}</article>`).join('');
 app.innerHTML=`<section class="hero"><div class="portrait-wrap"><svg id="river" viewBox="0 0 560 760" role="img" aria-label="由生活主题组成的人物形态人生河流"></svg><p class="portrait-caption">河宽表示本次记录文本中的相对主题份额，不等于真实时间分配。点击身体、阶段或节点查看变化。</p></div><div class="side"><p class="eyebrow">${esc(state.nickname.toUpperCase())} · ANOTHER SELF</p><h1>${esc(data.title)}</h1><p class="boundary">${esc(data.subtitle)}。${esc(data.coverage?.summary||'仅反映本次提供的记录，不代表完整人生。')}${gapText}</p><div class="coverage">${coverageText()}</div><div class="mode"><button data-mode="past" class="${futureMode?'':'active'}">回看过去</button><button data-mode="future" class="${futureMode?'active':''}">推演一年后</button></div><div class="legend" id="legend"></div><div class="theme-detail" id="themeDetail"></div><div class="periods">${data.periods.map((p,i)=>`<button data-period="${i}" class="${i===selectedPeriod?'active':''}">${esc(p)}</button>`).join('')}</div></div><span class="scroll-cue">向下继续阅读 ↓</span></section>
 <section class="report" id="past"><div class="section-head"><p class="section-kicker">HOW I GOT HERE</p><div><h2>我如何走到这里</h2><p>这些节点由本次记录提取。原文证据经过简化与匿名化，请由你判断它是否准确。</p></div></div><div class="timeline">${milestones}</div></section>
 <section class="report"><div class="section-head"><p class="section-kicker">PATTERNS IN MY RECORDS</p><div><h2>记录中的我</h2><p>它们不是人格结论，而是这批记录中反复出现或正在变化的线索。</p></div></div><div class="insights">${insights}</div></section>
 <section class="future-shell" id="future"><div class="section-head"><p class="section-kicker">POSSIBLE FUTURES</p><div><h2>如果延续这些投入，我可能走向哪里</h2><p>以下是条件化情景，不是命运预测。选择一条路径，看看另世我的身体可能怎样变化。</p></div></div>${paths?`<div class="paths">${paths}</div>`:'<p>这批记录还不足以形成可靠的未来路径。</p>'}<div class="role-models" id="roleModels"></div><div class="next-action" id="nextAction"></div></section>
 <section class="letter"><p class="section-kicker">A LETTER TO NOW</p><h2>另世我写给此刻的${esc(state.nickname)}</h2><div class="letter-text">${esc(data.letter)}</div><div class="audit"><div><strong id="confirmedCount">${review.confirmed.length}</strong><span>已确认</span></div><div><strong id="hiddenCount">${review.hidden.length}</strong><span>已隐藏</span></div><div><strong>${Math.max(0,countReviewable()-review.confirmed.length-review.hidden.length)}</strong><span>仍需核对</span></div></div>${data.privacyWarnings?.length?`<p class="privacy"><strong>分享前请再次检查：</strong>${esc(data.privacyWarnings.join('、'))}。完整网页默认只保存在你的设备；分享图会自动排除已经隐藏的内容。</p>`:''}<div class="end-actions"><button class="button primary" id="downloadEnd">下载完整私密网页</button><button class="button" id="share">生成脱敏分享图</button><button class="button" id="printEnd">打印 / 存为 PDF</button></div></section>`;
 bind();draw();renderLegend();renderFuture();updateUndo();
}
function countReviewable(){return (data.themes?.length||0)+(data.milestones?.length||0)+(data.insights?.length||0)+(data.futurePaths?.length||0)}
function renderLegend(){const el=document.querySelector('#legend');el.innerHTML=data.themes.map((t,i)=>{const value=futureMode?futureShare(t):t.shares[selectedPeriod]||0;return `<button data-theme="${esc(t.key)}" class="${t.key===selectedTheme?'active':''}"><span class="dot" style="background:${t.color}"></span><b>${esc(t.label)}</b><small>${value.toFixed(1)}%</small></button>`}).join('');const t=data.themes.find(x=>x.key===selectedTheme)||data.themes[0],ti=data.themes.indexOf(t),values=t.shares,min=Math.min(...values),max=Math.max(...values),minI=values.indexOf(min),maxI=values.indexOf(max),themeReview=`<div class="review"><button data-confirm="theme:${ti}" class="${confirmed(`theme:${ti}`)?'confirmed':''}">${confirmed(`theme:${ti}`)?'✓ 已确认':'准确'}</button><button data-feedback="theme:${ti}">不准确</button></div>`;document.querySelector('#themeDetail').style.borderColor=t.color;document.querySelector('#themeDetail').innerHTML=(futureMode?`<h2>${esc(t.label)} · 条件化变化</h2><p>在所选未来情景中，这一主题从当前 ${values.at(-1).toFixed(1)}% 变化为 ${futureShare(t).toFixed(1)}%。这只是路径假设，不是预测。</p>`:`<h2>${esc(t.label)}</h2><p>在本次记录中，从“${esc(data.periods[minI])}”的 ${min.toFixed(1)}%，到“${esc(data.periods[maxI])}”的 ${max.toFixed(1)}% 高点。</p>`)+themeReview}
function futureShare(t){const p=data.futurePaths?.find(x=>x.key===selectedPath),last=t.shares.at(-1)||0;return Math.max(0,last+(Number(p?.themeChanges?.[t.key])||0))}
function draw(){const svg=document.querySelector('#river');if(!svg)return;svg.innerHTML='';const ns='http://www.w3.org/2000/svg',make=(tag,a={},text='')=>{const n=document.createElementNS(ns,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));n.textContent=text;return n},center=280,top=175,bottom=700,periodValues=futureMode?[...data.periods,'一年后']:data.periods;function val(theme,i){return futureMode&&i===periodValues.length-1?futureShare(theme):theme.shares[Math.min(i,theme.shares.length-1)]||0}function widthAt(t){const energy=data.themes.reduce((s,x)=>s+(x.shares[Math.min(selectedPeriod,x.shares.length-1)]||0)*(x.key.charCodeAt(0)%7+1),0)/700;const pts=[[0,54],[.12,46],[.25,96],[.44,154+energy*20],[.62,178-energy*12],[.78,132],[1,164]];for(let i=0;i<pts.length-1;i++)if(t<=pts[i+1][0]){const u=(t-pts[i][0])/(pts[i+1][0]-pts[i][0]);return pts[i][1]+(pts[i+1][1]-pts[i][1])*(u*u*(3-2*u))}return 164}function smooth(points){let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],e=points[Math.min(points.length-1,i+2)];d+=` C ${b[0]+(c[0]-a[0])/6} ${b[1]+(c[1]-a[1])/6},${c[0]-(e[0]-b[0])/6} ${c[1]-(e[1]-b[1])/6},${c[0]} ${c[1]}`}return d}function band(l,r){return `${smooth(l)} L ${r.at(-1)[0]} ${r.at(-1)[1]} ${smooth([...r].reverse()).replace(/^M [^C]+/,'')} Z`}const bounds=Array.from({length:data.themes.length+1},()=>[]);periodValues.forEach((_,pi)=>{const t=pi/Math.max(1,periodValues.length-1),y=top+t*(bottom-top),total=widthAt(t)*2,raw=data.themes.map(x=>val(x,pi)),sum=raw.reduce((a,b)=>a+b,0)||1;let x=center-total/2;bounds[0].push([x,y]);raw.forEach((v,ti)=>{x+=total*v/sum;bounds[ti+1].push([x,y])})});data.themes.forEach((t,i)=>{const p=make('path',{d:band(bounds[i],bounds[i+1]),fill:t.color,class:`river-band ${t.key===selectedTheme?'active':'muted'}`,'data-theme':t.key});svg.appendChild(p)});const seed=data.themes.reduce((s,t)=>s+t.label.length+t.key.length,0),rows=[3,5,6,7,6,5,3];let ci=seed;rows.forEach((count,row)=>{for(let col=0;col<count;col++){const bw=58+(ci%3)*5,bh=24,step=43,x=center-((count-1)*step+bw)/2+col*step+Math.sin(seed+row*4+col)*7,y=18+row*25;svg.appendChild(make('rect',{x,y,width:bw,height:bh,rx:6,fill:data.themes[ci++%data.themes.length].color,opacity:.92,transform:`rotate(${Math.sin(seed+row+col)*7} ${x+bw/2} ${y+bh/2})`}))}});if(!futureMode)data.milestones.forEach((m,i)=>{if(hidden(itemId('milestone',i)))return;const pi=m.periodIndex,ti=Math.max(0,data.themes.findIndex(t=>t.key===m.themeKey)),x=(bounds[ti][pi][0]+bounds[ti+1][pi][0])/2,y=top+pi/Math.max(1,periodValues.length-1)*(bottom-top),g=make('g',{class:'milestone-dot','data-node':i});g.append(make('circle',{cx:x,cy:y,r:5}),make('text',{x,y:y-11,'text-anchor':'middle'},m.label));svg.appendChild(g)})}
function renderFuture(){const p=data.futurePaths?.find(x=>x.key===selectedPath);document.querySelectorAll('[data-path]').forEach(x=>x.classList.toggle('active',x.dataset.path===selectedPath));const roles=(data.roleModels||[]).filter(x=>x.pathKey===selectedPath);document.querySelector('#roleModels').innerHTML=roles.length?roles.map(x=>`<article class="role"><h4>${esc(x.name)}</h4><p>${esc(x.identity)}</p><p>${esc(x.reason)}</p><a href="${esc(x.sourceUrl)}" target="_blank" rel="noopener">核验来源：${esc(x.sourceTitle||'公开资料')} ↗</a></article>`).join(''):'<article class="role"><h4>暂不展示人物参照</h4><p>没有足够可靠、可直接核验的公开来源时，系统不会为了凑数推荐人物。</p></article>';document.querySelector('#nextAction').innerHTML=p?`<small>一个低风险的下一步</small><strong>${esc(p.nextAction||'先记录一周，再决定是否继续。')}</strong>`:''}
function bind(){app.onclick=e=>{const theme=e.target.closest('[data-theme]');if(theme){selectedTheme=theme.dataset.theme;renderLegend();draw();return}const period=e.target.closest('[data-period]');if(period){selectedPeriod=Number(period.dataset.period);futureMode=false;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='past'));renderLegend();draw();return}const mode=e.target.closest('[data-mode]');if(mode){futureMode=mode.dataset.mode==='future';render();return}const node=e.target.closest('[data-node]');if(node){const m=data.milestones[Number(node.dataset.node)];selectedPeriod=m.periodIndex;selectedTheme=m.themeKey;renderLegend();draw();document.querySelector(`[data-item="milestone:${node.dataset.node}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return}const path=e.target.closest('[data-path]');if(path&&!e.target.closest('.review')){selectedPath=path.dataset.path;futureMode=true;renderFuture();renderLegend();draw();return}const c=e.target.closest('[data-confirm]');if(c){toggleConfirm(c.dataset.confirm);return}const h=e.target.closest('[data-hide]');if(h){changeWithHistory(()=>{review.hidden.push(h.dataset.hide);review.confirmed=review.confirmed.filter(x=>x!==h.dataset.hide)});return}const f=e.target.closest('[data-feedback]');if(f){openFeedback(f.dataset.feedback);return}if(e.target.closest('#downloadEnd'))download();if(e.target.closest('#share'))shareCard();if(e.target.closest('#printEnd'))print()}}
function changeWithHistory(fn){review.history.push(JSON.stringify({result:data,confirmed:review.confirmed,hidden:review.hidden,feedback:review.feedback}));if(review.history.length>10)review.history.shift();fn();save();render()}
function toggleConfirm(id){changeWithHistory(()=>{review.confirmed=review.confirmed.includes(id)?review.confirmed.filter(x=>x!==id):[...review.confirmed,id];review.hidden=review.hidden.filter(x=>x!==id)})}
function save(){try{sessionStorage.setItem('anotherSelfResult',JSON.stringify(state))}catch{}}function updateUndo(){document.querySelector('#undo').hidden=!review.history.length}
function openFeedback(id){feedbackTarget=id;document.querySelector('#feedback').classList.add('open');document.querySelector('#feedbackText').value=review.feedback[id]||'';document.querySelector('#feedbackText').focus()}
document.querySelector('#closeFeedback').onclick=()=>document.querySelector('#feedback').classList.remove('open');document.querySelector('#feedbackForm').onsubmit=async e=>{e.preventDefault();const feedback=document.querySelector('#feedbackText').value.trim(),status=document.querySelector('#feedbackStatus');if(!feedback)return;const [kind,indexText]=feedbackTarget.split(':'),index=Number(indexText),current=data[kind==='futurePath'?'futurePaths':`${kind}s`]?.[index],module=kind;status.textContent='正在只重新分析这一部分…';try{if(!state.apiUrl||!state.sourceText)throw new Error('当前结果缺少原记录或生成服务地址，请从上传页重新生成一次');const res=await fetch(state.apiUrl,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'review',module,current,feedback,diary:state.sourceText,context:{periods:data.periods,themes:data.themes}})}),payload=await res.json();if(!res.ok)throw new Error(payload.error||'局部分析失败');changeWithHistory(()=>{const key=kind==='futurePath'?'futurePaths':`${kind}s`;data[key][index]=payload.result;review.feedback[feedbackTarget]=feedback;review.confirmed=review.confirmed.filter(x=>x!==feedbackTarget)});document.querySelector('#feedback').classList.remove('open');status.textContent=''}catch(err){status.textContent=err.message}};
function exportState(){const clean=JSON.parse(JSON.stringify(state));clean.sourceText='';clean.apiUrl='';clean.reviewState.history=[];return clean}
function downloadableDocument(){const clone=document.documentElement.cloneNode(true),embedded=clone.ownerDocument.createElement('script');embedded.id='embeddedResult';embedded.type='application/json';embedded.textContent=JSON.stringify(exportState()).replace(/</g,'\\u003c');clone.querySelector('body').prepend(embedded);return '<!doctype html>\n'+clone.outerHTML}
function download(){const blob=new Blob([downloadableDocument()],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`另世我-${state.nickname}-${new Date().toISOString().slice(0,10)}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function shareCard(){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=1080;canvas.height=1350;const g=ctx.createLinearGradient(0,0,1080,1350);g.addColorStop(0,'#f9eaf5');g.addColorStop(1,'#d9b4d8');ctx.fillStyle=g;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#3e2348';ctx.font='700 28px sans-serif';ctx.fillText('ANOTHER SELF · 脱敏分享',80,100);ctx.font='500 72px serif';wrap(ctx,data.title,80,220,900,92);ctx.font='400 28px sans-serif';ctx.fillStyle='#756776';wrap(ctx,`基于 ${data.coverage?.range||'本次记录'} 的有限观察`,80,390,900,44);const visible=data.insights.filter((_,i)=>!hidden(itemId('insight',i))).slice(0,3);let y=570;visible.forEach((x,i)=>{ctx.fillStyle=data.themes[i%data.themes.length].color;ctx.fillRect(80,y-30,12,12);ctx.fillStyle='#3e2348';ctx.font='600 34px serif';ctx.fillText(x.title,115,y);ctx.fillStyle='#756776';ctx.font='400 23px sans-serif';wrap(ctx,x.body,115,y+48,820,36);y+=210});ctx.fillStyle='#3e2348';ctx.font='500 24px sans-serif';ctx.fillText('由我的真实生活记录长成 · 内容已经脱敏',80,1260);canvas.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=`另世我-脱敏分享-${new Date().toISOString().slice(0,10)}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)})}function wrap(ctx,text,x,y,w,line){let s='',yy=y;for(const ch of text){if(ctx.measureText(s+ch).width>w){ctx.fillText(s,x,yy);s=ch;yy+=line}else s+=ch}if(s)ctx.fillText(s,x,yy)}
document.querySelector('#undo').onclick=()=>{const last=review.history.pop();if(!last)return;const old=JSON.parse(last);state.result=old.result;review.confirmed=old.confirmed;review.hidden=old.hidden;review.feedback=old.feedback;save();location.reload()};document.querySelector('#print').onclick=()=>print();document.querySelector('#download').onclick=download;render();
})();
