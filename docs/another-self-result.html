<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>我的另世我｜生命记录生成</title>
<style>
:root{--ink:#442352;--paper:#fff9fe;--muted:#79697d;--line:rgba(68,35,82,.15);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#f6dff1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 5%,#fff,transparent 24%),linear-gradient(145deg,#fae9f7,#eed5ef 58%,#f8eaf6)}button,a{font:inherit}.top{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:auto;padding:18px 24px}.brand,.back{color:var(--ink);font-size:13px;font-weight:700;text-decoration:none}.actions{display:flex;gap:8px}.button{padding:9px 15px;border:1px solid var(--ink);border-radius:999px;color:var(--ink);background:rgba(255,255,255,.55);font-size:12px;font-weight:700;cursor:pointer}.button.primary{color:#fff;background:var(--ink)}main{width:min(1160px,calc(100% - 28px));margin:8px auto 60px}.hero{text-align:center}.kicker{margin:0;color:#9b5c92;font-size:11px;font-weight:800;letter-spacing:.18em}.hero h1{margin:10px 0 0;font:500 clamp(38px,6vw,70px)/1.08 ui-serif,Georgia,"Songti SC",serif;letter-spacing:-.05em}.hero p{max-width:700px;margin:14px auto 0;color:var(--muted);font-size:13px;line-height:1.8}.stage{display:grid;grid-template-columns:minmax(300px,.85fr) minmax(0,1.15fr);gap:24px;margin-top:30px}.portrait,.panel{border:1px solid rgba(255,255,255,.75);border-radius:28px;background:rgba(255,252,255,.7);box-shadow:0 24px 70px rgba(79,35,96,.11);backdrop-filter:blur(13px)}.portrait{position:relative;min-height:720px;padding:22px;overflow:hidden}.portrait svg{display:block;width:100%;height:660px}.portrait-note{position:absolute;right:24px;bottom:18px;left:24px;color:var(--muted);font-size:10px;line-height:1.6;text-align:center}.panel{padding:clamp(24px,4vw,46px)}.section-kicker{margin:0;color:#9b5c92;font-size:10px;font-weight:800;letter-spacing:.15em}.panel h2{margin:7px 0 0;font:500 29px/1.25 ui-serif,Georgia,"Songti SC",serif}.legend{display:grid;gap:8px;margin-top:22px}.legend button{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:11px;color:var(--ink);background:rgba(103,55,121,.055);text-align:left;cursor:pointer}.legend button.active{box-shadow:0 0 0 1px var(--ink);background:#fff}.dot{width:10px;height:10px;border-radius:50%}.legend small{color:var(--muted)}.detail{min-height:118px;margin-top:18px;padding:17px;border-left:3px solid var(--ink);border-radius:0 13px 13px 0;background:rgba(255,255,255,.58)}.detail h3{margin:0;font-size:15px}.detail p{margin:7px 0 0;color:var(--muted);font-size:12px;line-height:1.7}.periods{display:flex;justify-content:space-between;gap:5px;margin-top:18px;color:var(--muted);font-size:9px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}.card{padding:19px;border:1px solid var(--line);border-radius:18px;background:rgba(255,252,255,.65)}.card h3{margin:0;font:600 17px/1.35 ui-serif,Georgia,"Songti SC",serif}.card p{margin:10px 0 0;color:var(--muted);font-size:12px;line-height:1.75}.evidence{padding-top:10px;border-top:1px solid var(--line);font-size:10px!important}.letter{margin-top:24px;padding:clamp(25px,5vw,54px);border-radius:26px;color:#fff;background:linear-gradient(145deg,#42224f,#754085 64%,#a75ba0);box-shadow:0 24px 70px rgba(74,30,90,.16)}.letter h2{margin:7px 0 18px;font:500 30px/1.25 ui-serif,Georgia,"Songti SC",serif}.letter p{max-width:790px;margin:0;white-space:pre-wrap;font:400 15px/2 ui-serif,Georgia,"Songti SC",serif}.privacy{margin-top:18px;padding:17px;border:1px solid var(--line);border-radius:16px;color:var(--muted);background:rgba(255,255,255,.45);font-size:11px;line-height:1.7}.empty{max-width:600px;margin:120px auto;padding:40px;border-radius:24px;background:#fff;text-align:center}.empty a{color:var(--ink)}.river-band{cursor:pointer;transition:opacity .2s,filter .2s}.river-band.muted{opacity:.18}.river-band.active{filter:drop-shadow(0 5px 9px rgba(68,35,82,.22))}.milestone text{font-size:10px;font-weight:700;paint-order:stroke;stroke:rgba(255,255,255,.88);stroke-width:3px;stroke-linejoin:round}.milestone circle{fill:#fff;stroke:#442352;stroke-width:1.2}@media(max-width:800px){.stage{grid-template-columns:1fr}.portrait{min-height:620px}.portrait svg{height:560px}.cards{grid-template-columns:1fr}.top{padding:14px}.actions .button:not(.primary){display:none}}@media print{body{background:#fff}.top{display:none}.portrait,.panel{box-shadow:none}.stage{break-inside:avoid}.letter{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><a class="back" href="generate-another-self.html">← 重新生成</a><div class="actions"><button class="button" id="print">打印 / 存为PDF</button><button class="button primary" id="download">下载私密网页</button></div></header>
<main id="app"></main>
<script>
(() => {
  const raw=sessionStorage.getItem('anotherSelfResult');const app=document.querySelector('#app');
  if(!raw){app.innerHTML='<section class="empty"><h1>这里还没有另世我</h1><p>请先上传生活记录并完成生成。</p><a href="generate-another-self.html">开始生成 →</a></section>';return}
  const state=JSON.parse(raw),data=state.result;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const avg=theme=>theme.shares.reduce((a,b)=>a+b,0)/theme.shares.length;
  app.innerHTML=`<header class="hero"><p class="kicker">${esc(state.nickname.toUpperCase())} · ANOTHER SELF</p><h1>${esc(data.title)}</h1><p>${esc(data.subtitle)}。这是一份基于本次记录的AI辅助初稿，不是完整人生结论。</p></header><section class="stage"><article class="portrait"><svg id="river" viewBox="0 0 520 700" role="img" aria-label="由生活主题组成的人物形态人生河流"></svg><p class="portrait-note">河宽表示记录文本中的相对主题份额，不等于实际时间分配。点击颜色查看变化。</p></article><article class="panel"><p class="section-kicker">LIFE RIVER</p><h2>你的记录正在长成一个人</h2><div class="legend" id="legend"></div><div class="detail" id="detail"><h3>点击一个主题</h3><p>查看它在不同记录阶段中的变化。</p></div><div class="periods">${data.periods.map(p=>`<span>${esc(p)}</span>`).join('')}</div></article></section><section class="cards">${data.insights.map(x=>`<article class="card"><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><p class="evidence">依据：${esc(x.evidence||'本次提供的记录')}</p></article>`).join('')}</section><section class="letter"><p class="section-kicker">A LETTER TO NOW</p><h2>写给此刻的${esc(state.nickname)}</h2><p>${esc(data.letter)}</p></section>${data.privacyWarnings?.length?`<aside class="privacy"><strong>分享前请再次检查：</strong> ${data.privacyWarnings.map(esc).join('、')}。下载结果默认只保存在你的设备，系统不会自动公开。</aside>`:''}`;

  const svg=document.querySelector('#river'),ns='http://www.w3.org/2000/svg',W=520,top=150,bottom=650,center=260;
  const make=(tag,attrs={},text='')=>{const node=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text)node.textContent=text;return node};
  function widthAt(t){const pts=[[0,58],[.12,45],[.23,88],[.4,158],[.56,184],[.7,132],[.84,148],[1,178]];for(let i=0;i<pts.length-1;i++){if(t>=pts[i][0]&&t<=pts[i+1][0]){const u=(t-pts[i][0])/(pts[i+1][0]-pts[i][0]);return pts[i][1]+(pts[i+1][1]-pts[i][1])*(u*u*(3-2*u))}}return 178}
  function smooth(points){let d=`M ${points[0][0]} ${points[0][1]}`;for(let i=0;i<points.length-1;i++){const a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],e=points[Math.min(points.length-1,i+2)];d+=` C ${b[0]+(c[0]-a[0])/6} ${b[1]+(c[1]-a[1])/6}, ${c[0]-(e[0]-b[0])/6} ${c[1]-(e[1]-b[1])/6}, ${c[0]} ${c[1]}`}return d}
  function band(left,right){return `${smooth(left)} L ${right[right.length-1][0]} ${right[right.length-1][1]} ${smooth([...right].reverse()).replace(/^M [^C]+/,'')} Z`}
  const bounds=Array.from({length:data.themes.length+1},()=>[]);data.periods.forEach((_,pi)=>{const t=pi/(data.periods.length-1),y=top+t*(bottom-top),total=widthAt(t)*2;let x=center-total/2;bounds[0].push([x,y]);data.themes.forEach((theme,ti)=>{x+=total*(theme.shares[pi]||0)/100;bounds[ti+1].push([x,y])})});
  data.themes.forEach((theme,i)=>{const p=make('path',{d:band(bounds[i],bounds[i+1]),fill:theme.color,class:'river-band','data-key':theme.key});p.addEventListener('click',()=>select(theme.key));svg.appendChild(p)});
  const head=make('g');const headRows=[3,5,6,7,6,5,3];let ci=0;headRows.forEach((count,row)=>{for(let col=0;col<count;col++){const bw=62,bh=25,step=43,x=center-((count-1)*step+bw)/2+col*step+Math.sin(row*4+col)*5,y=14+row*25;head.appendChild(make('rect',{x,y,width:bw,height:bh,rx:5,fill:data.themes[ci++%data.themes.length].color,opacity:.9,transform:`rotate(${Math.sin(row+col)*6} ${x+bw/2} ${y+bh/2})`}))}});svg.appendChild(head);
  data.milestones.forEach(item=>{const pi=Math.min(data.periods.length-1,Math.max(0,item.periodIndex)),ti=Math.max(0,data.themes.findIndex(t=>t.key===item.themeKey)),x=(bounds[ti][pi][0]+bounds[ti+1][pi][0])/2,y=top+pi/(data.periods.length-1)*(bottom-top),g=make('g',{class:'milestone'});g.appendChild(make('circle',{cx:x,cy:y,r:4}));g.appendChild(make('text',{x,y:y-9,'text-anchor':'middle'},item.label));svg.appendChild(g)});
  const legend=document.querySelector('#legend');data.themes.forEach(theme=>{const b=document.createElement('button');b.dataset.key=theme.key;b.innerHTML=`<span class="dot" style="background:${theme.color}"></span><b>${esc(theme.label)}</b><small>${avg(theme).toFixed(1)}%</small>`;b.addEventListener('click',()=>select(theme.key));legend.appendChild(b)});
  function select(key){const theme=data.themes.find(t=>t.key===key),min=Math.min(...theme.shares),max=Math.max(...theme.shares),minI=theme.shares.indexOf(min),maxI=theme.shares.indexOf(max);document.querySelectorAll('.river-band').forEach(p=>{p.classList.toggle('active',p.dataset.key===key);p.classList.toggle('muted',p.dataset.key!==key)});document.querySelectorAll('#legend button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));document.querySelector('#detail').style.borderColor=theme.color;document.querySelector('#detail').innerHTML=`<h3>${esc(theme.label)}</h3><p>从“${esc(data.periods[minI])}”的 ${min.toFixed(1)}%，到“${esc(data.periods[maxI])}”的 ${max.toFixed(1)}% 高点。这里展示的是记录文本份额变化。</p>`}
  select(data.themes[0].key);
  document.querySelector('#print').addEventListener('click',()=>print());
  document.querySelector('#download').addEventListener('click',()=>{document.querySelectorAll('.river-band').forEach(p=>p.classList.remove('muted','active'));const clone=document.documentElement.cloneNode(true);clone.querySelector('.top')?.remove();clone.querySelectorAll('script').forEach(s=>s.remove());clone.querySelector('#detail').innerHTML='<h3>可交互原版中的主题详情</h3><p>这是下载保存的静态私密副本。各河流宽度代表记录文本中的相对主题份额。</p>';const blob=new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`另世我-${state.nickname}-${new Date().toISOString().slice(0,10)}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
})();
</script>
</body>
</html>
